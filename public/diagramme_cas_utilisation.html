<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Diagramme de cas d'utilisation — FENDRI</title>
<style>

  svg { display: block; }
</style>
</head>
<body>

  <rect width="1280" height="710" fill="white"/>

  <line x1="397" y1="568" x2="436" y2="552" stroke="#666" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-open)"/>

  <line x1="136" y1="575" x2="186" y2="577" stroke="#777" stroke-width="1"/>

  <line x1="894" y1="174" x2="912" y2="190" stroke="#666" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-open)"/>
  <text x="902" y="190" text-anchor="middle" font-size="7" fill="#555">«include»</text>

  <ellipse cx="993" cy="348" rx="80" ry="18" fill="#fafafa" stroke="#666" stroke-width="1.2"/>

  <line x1="886" y1="358" x2="912" y2="352" stroke="#666" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-open)"/>
  <text x="898" y="349" text-anchor="middle" font-size="7" fill="#555">«include»</text>
  <line x1="886" y1="374" x2="912" y2="386" stroke="#666" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-open)"/>

  <ellipse cx="993" cy="448" rx="80" ry="18" fill="#fafafa" stroke="#666" stroke-width="1.2"/>

  <ellipse cx="993" cy="488" rx="80" ry="18" fill="#fafafa" stroke="#666" stroke-width="1.2"/>

  <line x1="893" y1="458" x2="912" y2="452" stroke="#666" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-open)"/>
  <text x="901" y="450" text-anchor="middle" font-size="7" fill="#555">«include»</text>
  <line x1="893" y1="474" x2="912" y2="486" stroke="#666" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-open)"/>

  <text x="695" y="699" text-anchor="middle" font-size="8.5" fill="#333">Association acteur → cas d'utilisation</text>

  <text x="638" y="701" text-anchor="middle" font-size="0"/>
